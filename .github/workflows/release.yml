name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo test
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/release/rustrs.exe dist/rustrs.exe
            cd dist && sha256sum rustrs.exe > SHA256SUMS
          else
            cp target/release/rustrs dist/rustrs
            tar -czf rustrs-${{ matrix.os }}.tar.gz -C dist rustrs
            sha256sum rustrs rustrs-${{ matrix.os }}.tar.gz > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rustrs-${{ matrix.os }}
          path: dist/
