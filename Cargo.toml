[package]
name = "rustrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Rust API scaffolding CLI"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
